name: Build and distribute

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (optional)"
        required: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # Секреты есть только для push в main и ручного запуска (не для PR из форков).
      - name: Check secrets
        id: secrets
        if: github.event_name != 'pull_request'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          APP: ${{ secrets.FIREBASE_APP_ID }}
        run: |
          if [ -n "$KS" ] && [ -n "$SA" ] && [ -n "$APP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets are not configured — run scripts/setup-secrets.sh. Distribution skipped."
          fi

      - name: Decode keystore
        if: steps.secrets.outputs.ready == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_BOT_TOKEN || '' }}
          TELEGRAM_CHAT_ID: ${{ github.event_name != 'pull_request' && secrets.TELEGRAM_CHAT_ID || '' }}
        run: ./gradlew --no-daemon :app:assembleRelease -PversionCode=$VERSION_CODE

      - name: Release notes
        if: steps.secrets.outputs.ready == 'true'
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          {
            if [ -n "$INPUT_NOTES" ]; then echo "$INPUT_NOTES"; else git log -1 --pretty=%B; fi
            echo
            echo "Build ${VERSION_CODE} · ${GITHUB_SHA::7}"
          } > "$RUNNER_TEMP/notes.txt"
          cat "$RUNNER_TEMP/notes.txt"

      - uses: actions/setup-node@v7
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: "22"

      - name: Distribute to Firebase App Distribution
        if: steps.secrets.outputs.ready == 'true'
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          TESTERS: ${{ secrets.FIREBASE_TESTERS }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15 appdistribution:distribute app/build/outputs/apk/release/app-release.apk \
            --app "$FIREBASE_APP_ID" \
            --testers "$TESTERS" \
            --release-notes-file "$RUNNER_TEMP/notes.txt"
          rm -f "$RUNNER_TEMP/sa.json"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/sa.json"
